name: Build Skyshoot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot and export templates
        uses: chickensoftware/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Skyshoot.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skyshoot-Android-APK
          path: build/Skyshoot.apk
          if-no-files-found: error
          retention-days: 30
